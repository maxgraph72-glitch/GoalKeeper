[package]
name = "goal-keeper"
version = "0.1.0"
description = "Локальное приложение для работы с целями"
authors = ["Goal Keeper contributors"]
edition = "2021"

[lib]
name = "goal_keeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

